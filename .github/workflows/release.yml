name: Release

# Solo los cambios del firmware publican una release (OTA): el backend y la
# web app (server/) se despliegan aparte en la Raspberry, ver server/README.md.
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/release.yml"
      - ".releaserc.json"
      - "package.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Install release dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
