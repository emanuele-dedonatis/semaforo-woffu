[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
monitor_speed = 115200
upload_speed = 115200
; evita que el monitor resetee la ESP32 en bucle al conectar (toggle de DTR/RTS
; en el USB-serial, cableado al pin EN)
monitor_rts = 0
monitor_dtr = 0
; NONE: silencia el log_e interno de WebServer ("request handler not found"),
; que salta en cada request no reconocida (sondas de deteccion de portal cautivo
; del SO) aunque haya un onNotFound registrado. No afecta a nuestros Serial.print.
build_flags =
    -D CORE_DEBUG_LEVEL=0
; en builds de release (CI), tools/build_firmware.sh fija FIRMWARE_VERSION
; via PLATFORMIO_BUILD_FLAGS con la version exacta; este script solo actua
; si no viene ya fijado (build local), embebiendo <tag+1>-<hash corto>
extra_scripts = pre:tools/dev_version.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit PN532 @ ^1.3.4
    adafruit/Adafruit BusIO @ ^1.16.1
